name: Publish stable release
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm run smoke
      - run: npm run release:pack
  desktop:
    # The desktop app (Tauri 2): a macOS .dmg (Apple silicon) and a Windows NSIS installer.
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pattern: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            suffix: macos-arm64.dmg
          - os: windows-latest
            pattern: desktop/src-tauri/target/release/bundle/nsis/*.exe
            suffix: windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Name the installer by version and platform
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p desktop-out
          cp ${{ matrix.pattern }} "desktop-out/HRouter-Stock-Workbench-${version}-${{ matrix.suffix }}"
          ls -la desktop-out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop-out/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:pack
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: output/releases
          merge-multiple: true
      - name: Add the installers to the checksums
        run: cd output/releases && sha256sum HRouter-Stock-Workbench-* >> SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload all assets before making the release visible to updaters
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw Error("Refusing to overwrite a published release")'
            gh release upload "$tag" output/releases/* --clobber
          else
            notes="docs/releases/$tag.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" output/releases/* --draft --title "$(head -1 "$notes" | sed 's/^# //')" --notes-file "$notes" --verify-tag
            else
              gh release create "$tag" output/releases/* --draft --title "$tag" --generate-notes --verify-tag
            fi
          fi
          gh release edit "$tag" --draft=false --latest
