[package]
name = "hrouter-stock-workbench"
version = "1.8.3"
description = "HRouter 股票工作台"
edition = "2021"

[lib]
name = "stock_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# 新版 macOS 链接器下，剥离过的过程宏动态库会加载失败（mis-aligned LINKEDIT），所以不剥离
strip = "none"

[profile.release.build-override]
strip = "none"
